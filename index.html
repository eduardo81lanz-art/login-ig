<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h2>Iniciar sesión</h2>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Teléfono, nombre de usuario o correo electrónico" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <button type="submit">Iniciar sesión</button>
            </form>
            <p class="forgot-password"><a href="#">¿Olvidaste tu contraseña?</a></p>
        </div>
        <div class="divider"></div>
        <div class="signup-box">
            <p>¿No tienes una cuenta? <a href="#" id="signupLink">Regístrate</a></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
